services:
  db:
    image: postgres:16
    container_name: animal-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: animal_adoption
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: animal_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animal_adoption"]
      interval: 5s
      timeout: 5s
      retries: 10

  server-b:
    build: ./server-b
    container_name: animal-server-b
    restart: unless-stopped
    environment:
      PORT: 3002
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: animal_adoption
      DB_USER: postgres
      DB_PASSWORD: animal_password
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy

  server-a:
    build: ./server-a
    container_name: animal-server-a
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: animal_adoption
      DB_USER: postgres
      DB_PASSWORD: animal_password
      ADOPTION_SERVICE_URL: http://server-b:3002
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      server-b:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: animal-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server-a

volumes:
  postgres_data:
